# BlankJava local stack (docs/technical_analysis.md §3.5). See infra/README.md.
#   cp .env.example .env
#   docker compose up --build --wait      -> https://localhost
#
# Profiles: observability (Loki, Alloy, Grafana: infra/observability/README.md);
# reserved: e2e and e2e-runner (Selenium, #7).

name: blankjava

x-logging: &logging
  # Container logs are rotated so they can never fill the disk
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    # Statements slower than 500 ms are logged (docs/technical_analysis.md §6.4)
    command: ["postgres", "-c", "log_min_duration_statement=500"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>
      - postgres-data:/var/lib/postgresql
    # Reachable from this machine only, for ./gradlew bootRun outside Docker (infra/README.md)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [stack]
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-local}
    image: blankjava-backend:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # One JSON access log line per request, with trace id and the client IP seen by the backend
      BLANKJAVA_ACCESS_LOG_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    # Not published on the host: the only entry point is Nginx (frontend)
    networks: [stack]
    logging: *logging

  cert-init:
    # Generates a self-signed development certificate once; a mounted real certificate is kept
    image: alpine:3.24
    command:
      - sh
      - -c
      - |
        set -e
        if [ -s /certs/tls.crt ] && [ -s /certs/tls.key ]; then
          echo "Certificate already present, kept."
          exit 0
        fi
        apk add --no-cache openssl > /dev/null
        openssl req -x509 -newkey rsa:3072 -sha256 -nodes -days 825 \
          -keyout /certs/tls.key -out /certs/tls.crt \
          -subj "/CN=BlankJava local development" \
          -addext "subjectAltName=DNS:localhost,DNS:frontend,IP:127.0.0.1"
        # Readable by the non-root Nginx user (uid 101) only
        chown 101:101 /certs/tls.key /certs/tls.crt
        chmod 600 /certs/tls.key
        chmod 644 /certs/tls.crt
        echo "Self-signed certificate generated for localhost and frontend."
    volumes:
      - certs:/certs
    networks: [stack]
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-local}
    image: blankjava-frontend:local
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    # Lets the non-root Nginx user bind 80 and 443 inside its own network namespace
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./infra/nginx/proxy.conf:/etc/nginx/snippets/proxy.conf:ro
      - certs:/etc/nginx/certs:ro
    healthcheck:
      # 127.0.0.1, not localhost: on Alpine localhost resolves to ::1
      test: ["CMD", "wget", "--quiet", "--spider", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      cert-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      stack:
        # Fixed address: the backend trusts X-Forwarded-* from this proxy only
        ipv4_address: 172.30.0.10
    logging: *logging

  # ---- observability profile: docker compose --profile observability up -d (infra/observability) ----
  loki:
    profiles: [observability]
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    # Query API on this machine only (curl, scripts)
    ports:
      - "127.0.0.1:3100:3100"
    # No health check: the image has no shell. Alloy retries pushes until Loki is ready (~15 s).
    networks: [stack]
    logging: *logging

  alloy:
    profiles: [observability]
    image: grafana/alloy:v1.21.2
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/observability/config.alloy:/etc/alloy/config.alloy:ro
      # Reads container logs through the Docker API (read-only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    networks: [stack]
    logging: *logging

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.3.0
    environment:
      # Local tool only (bound to 127.0.0.1): no login, Explore allowed
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      loki:
        condition: service_started
    networks: [stack]
    logging: *logging

volumes:
  postgres-data:
  certs:
  loki-data:

networks:
  stack:
    # Fixed subnet, so Nginx (frontend) can have a fixed address
    ipam:
      config:
        - subnet: 172.30.0.0/24
