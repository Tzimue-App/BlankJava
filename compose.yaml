# BlankJava local stack (docs/technical_analysis.md §3.5). See infra/README.md.
#   cp .env.example .env
#   docker compose up --build --wait      -> https://localhost
#
# Profiles reserved for later services: e2e and e2e-runner (Selenium, #7), observability (#6).

name: blankjava

x-logging: &logging
  # Container logs are rotated so they can never fill the disk
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>
      - postgres-data:/var/lib/postgresql
    # Reachable from this machine only, for ./gradlew bootRun outside Docker (infra/README.md)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [stack]
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-local}
    image: blankjava-backend:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # One access log line per request, with the client IP seen by the backend
      SERVER_TOMCAT_ACCESSLOG_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    # Not published on the host: the only entry point is Nginx (frontend)
    networks: [stack]
    logging: *logging

  cert-init:
    # Generates a self-signed development certificate once; a mounted real certificate is kept
    image: alpine:3.24
    command:
      - sh
      - -c
      - |
        set -e
        if [ -s /certs/tls.crt ] && [ -s /certs/tls.key ]; then
          echo "Certificate already present, kept."
          exit 0
        fi
        apk add --no-cache openssl > /dev/null
        openssl req -x509 -newkey rsa:3072 -sha256 -nodes -days 825 \
          -keyout /certs/tls.key -out /certs/tls.crt \
          -subj "/CN=BlankJava local development" \
          -addext "subjectAltName=DNS:localhost,DNS:frontend,IP:127.0.0.1"
        # Readable by the non-root Nginx user (uid 101) only
        chown 101:101 /certs/tls.key /certs/tls.crt
        chmod 600 /certs/tls.key
        chmod 644 /certs/tls.crt
        echo "Self-signed certificate generated for localhost and frontend."
    volumes:
      - certs:/certs
    networks: [stack]
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_RELEASE: ${APP_RELEASE:-local}
    image: blankjava-frontend:local
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    # Lets the non-root Nginx user bind 80 and 443 inside its own network namespace
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./infra/nginx/proxy.conf:/etc/nginx/snippets/proxy.conf:ro
      - certs:/etc/nginx/certs:ro
    healthcheck:
      # 127.0.0.1, not localhost: on Alpine localhost resolves to ::1
      test: ["CMD", "wget", "--quiet", "--spider", "--no-check-certificate", "https://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      cert-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      stack:
        # Fixed address: the backend trusts X-Forwarded-* from this proxy only
        ipv4_address: 172.30.0.10
    logging: *logging

volumes:
  postgres-data:
  certs:

networks:
  stack:
    # Fixed subnet, so Nginx (frontend) can have a fixed address
    ipam:
      config:
        - subnet: 172.30.0.0/24
