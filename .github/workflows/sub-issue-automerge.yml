name: "Sub-issue auto-merge"

# Enables auto-merge (squash) on a sub-issue pull request into its issue branch (#131).
# The merge itself waits for the "agent-review" commit status that /implement-issue sets: the
# ruleset on issue branches requires it (setup in .claude/README.md, "Repository settings").
#
# Only for a pull request whose base is an issue branch "<type>/<issue>-<slug>" and whose head
# is a sub-issue branch "<type>/<issue>-<sub-issue>-<slug>" of the same issue, the head issue
# being a sub-issue of the base issue in GitHub. Pull requests into dev, test, main and the
# milestone branches never match the "*/*" filter: they stay merged by a human.
#
# Without a rule requiring "agent-review" on the base branch, enabling auto-merge would merge at
# once: the job then fails instead of enabling it.
# A merge done with the workflow token triggers no other workflow: /implement-issue closes the
# sub-issue itself.

on:
  pull_request:
    branches:
      - "*/*"
    # /implement-issue opens a draft and marks it ready once "agent-review" is set: auto-merge
    # cannot be enabled on a draft.
    types: [opened, reopened, ready_for_review]

concurrency:
  group: sub-issue-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  enable-auto-merge:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Match the issue and sub-issue branches
        id: branches
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          types='(feat|fix|chore|refactor|perf|security|ci|docs|test)'
          slug='[a-z0-9][a-z0-9-]*'
          # A sub-issue branch is not an issue branch (tested first: a test resets BASH_REMATCH).
          if [[ "$BASE" =~ ^[a-z]+/[0-9]+-[0-9]+- ]] || [[ ! "$BASE" =~ ^${types}/([0-9]+)-${slug}$ ]]; then
            echo "Base $BASE is not an issue branch: nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "match=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issue="${BASH_REMATCH[2]}"
          if [[ ! "$HEAD" =~ ^${types}/${issue}-([0-9]+)-${slug}$ ]]; then
            echo "Head $HEAD is not a sub-issue branch of #$issue: nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "match=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "match=true"
            echo "issue=$issue"
            echo "sub_issue=${BASH_REMATCH[2]}"
          } >> "$GITHUB_OUTPUT"

      - name: Check that the head issue is a sub-issue of the base issue
        id: sub-issue
        if: steps.branches.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.branches.outputs.issue }}
          SUB_ISSUE: ${{ steps.branches.outputs.sub_issue }}
        run: |
          if gh api --paginate "repos/$REPO/issues/$ISSUE/sub_issues" --jq '.[].number' | grep -qx "$SUB_ISSUE"; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "#$SUB_ISSUE is not a sub-issue of #$ISSUE: nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the base branch requires agent-review
        if: steps.sub-issue.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          contexts=$(gh api "repos/$REPO/rules/branches/$BASE" \
            --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context')
          if ! grep -qx "agent-review" <<< "$contexts"; then
            echo "::error::No active ruleset on $BASE requires the agent-review status: auto-merge would merge at once. See .claude/README.md, Repository settings."
            exit 1
          fi

      - name: Enable auto-merge
        if: steps.sub-issue.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          gh pr merge "$PR" --repo "$REPO" --auto --squash
          echo "Auto-merge (squash) enabled into $BASE: GitHub merges once agent-review is success." >> "$GITHUB_STEP_SUMMARY"
