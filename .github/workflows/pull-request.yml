name: "Pull request suite"

# Decides whether a PR can be merged (docs/technical_analysis.md §7.2).
# Checks the modules changed by the WHOLE PR (diff with the base branch): everything the push
# suite does, plus integration tests, diff coverage on changed lines, branch flow and version
# directives, Docker image build and dependency review.
# Selenium runs last, against the full stack, for every PR into dev, test and main, and for PRs
# into a milestone branch labelled "run-e2e". The human reviewer validates the PR with its report.
#
# Branch rulesets require ONE check: "pr-gate". It runs after every other job and fails if any
# of them failed or was cancelled, or if Selenium did not pass where it is mandatory. Job names
# can therefore change (or jobs be skipped) without touching the rulesets.
# Every event, including "labeled", runs the full suite: a run that skipped its jobs would
# otherwise report green checks for the PR's latest commit.

on:
  pull_request:
    branches:
      - dev
      - test
      - main
      - "v[0-9]+.[0-9]+.[0-9]+-a"
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASE_REF: origin/${{ github.base_ref }}
  # Minimum share of the PR's changed lines covered by tests
  DIFF_COVERAGE_MIN: 80

jobs:
  flow-and-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check branch flow and CHANGELOG version directives
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python bump_version.py --check "$BASE_REF" --head-ref "$HEAD_REF"

  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.modules.outputs.api }}
      backend: ${{ steps.modules.outputs.backend }}
      frontend: ${{ steps.modules.outputs.frontend }}
      e2e: ${{ steps.modules.outputs.e2e }}
      tooling: ${{ steps.modules.outputs.tooling }}
      stack: ${{ steps.modules.outputs.stack }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect what this PR changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: .github/module-filters.yml

      - name: Keep only modules that exist
        id: modules
        run: |
          has() { [ "$1" = "true" ] && [ -e "$2" ] && echo true || echo false; }
          echo "api=$(has '${{ steps.filter.outputs.api }}' api/openapi.yaml)" >> "$GITHUB_OUTPUT"
          echo "backend=$(has '${{ steps.filter.outputs.backend }}' backend/gradlew)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(has '${{ steps.filter.outputs.frontend }}' frontend/package.json)" >> "$GITHUB_OUTPUT"
          echo "e2e=$(has '${{ steps.filter.outputs.e2e }}' e2e/gradlew)" >> "$GITHUB_OUTPUT"
          echo "tooling=$(has '${{ steps.filter.outputs.tooling }}' bump_version.py)" >> "$GITHUB_OUTPUT"
          # The Selenium suite needs the whole stack, whatever the PR changed
          echo "stack=$([ -f compose.yaml ] && [ -f e2e/gradlew ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  tooling:
    # Release script (bump_version.py) and its tests: not a component, so no other job covers it
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Release script tests
        run: python -m unittest discover -s tests -t . -v

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Project rules live in api/.spectral.yaml; Spectral only auto-loads a ruleset from the
      # working directory, so it is passed explicitly. Warnings fail the job.
      - name: Lint the OpenAPI contract (Spectral 6.17.0)
        run: npx --yes @stoplight/spectral-cli@6.17.0 lint api/openapi.yaml --ruleset api/.spectral.yaml --fail-severity=warn

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # The contract must stay readable by both code generators (OpenAPI 3.1, see api/README.md)
      - name: Backend generator accepts the contract (openapi-generator 7.26.0)
        run: |
          GEN="npx --yes @openapitools/openapi-generator-cli@2.42.0 --openapitools api/openapitools.json"
          $GEN validate -i api/openapi.yaml
          $GEN generate -i api/openapi.yaml -g spring -o "$RUNNER_TEMP/spring" --dry-run \
            --additional-properties=interfaceOnly=true,useJakartaEe=true

      - name: Frontend generator accepts the contract (ng-openapi-gen 1.1.0)
        run: npx --yes ng-openapi-gen@1.1.0 --input api/openapi.yaml --output "$RUNNER_TEMP/angular"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # check = format, Error Prone, unit + slice + Testcontainers integration tests, coverage thresholds
      - name: Full backend checks
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew check jacocoTestReport --no-daemon

      - name: Diff coverage on the lines changed by this PR
        run: |
          pip install --quiet diff-cover
          diff-cover backend/build/reports/jacoco/test/jacocoTestReport.xml \
            --src-roots backend/src/main/java \
            --compare-branch "$BASE_REF" \
            --fail-under "$DIFF_COVERAGE_MIN" \
            --markdown-report diff-coverage-backend.md
          { echo "## Backend diff coverage"; cat diff-coverage-backend.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/build/reports/
            diff-coverage-backend.md
          if-no-files-found: ignore

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint, format, unit tests with coverage, production build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run test:ci
          npm run build

      - name: Diff coverage on the lines changed by this PR
        run: |
          pip install --quiet diff-cover
          diff-cover frontend/coverage/lcov.info \
            --compare-branch "$BASE_REF" \
            --fail-under "$DIFF_COVERAGE_MIN" \
            --markdown-report diff-coverage-frontend.md
          { echo "## Frontend diff coverage"; cat diff-coverage-frontend.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/
            diff-coverage-frontend.md
          if-no-files-found: ignore

  e2e-compile:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Format and compile the Selenium tests
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck compileTestJava --no-daemon

  docker-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images without pushing
        run: |
          for module in backend frontend; do
            if [ -f "$module/Dockerfile" ]; then
              # Root context: images are generated from api/openapi.yaml
              docker buildx build -f "$module/Dockerfile" .
            else
              echo "No $module/Dockerfile yet, skipping."
            fi
          done

  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Review new dependencies for known vulnerabilities and licences
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  selenium:
    # Final check, only once everything else passed
    needs: [flow-and-versions, changes, api, backend, frontend, e2e-compile, docker-build]
    if: |
      always() && needs.changes.outputs.stack == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (contains(fromJSON('["dev","test","main"]'), github.base_ref) ||
       contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/e2e.yml

  pr-gate:
    # The only check required by the branch rulesets
    needs: [flow-and-versions, changes, tooling, api, backend, frontend, e2e-compile, docker-build, dependency-review, selenium]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every job result
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
          SELENIUM_EXPECTED: >-
            ${{ needs.changes.outputs.stack == 'true' &&
                (contains(fromJSON('["dev","test","main"]'), github.base_ref) ||
                 contains(github.event.pull_request.labels.*.name, 'run-e2e')) }}
        run: |
          import json, os

          results = {job: data["result"] for job, data in json.loads(os.environ["RESULTS"]).items()}
          errors = []
          for job, result in results.items():
              if result in ("failure", "cancelled"):
                  errors.append(f"{job}: {result}")
          # These two always run: skipped means the PR was never checked
          for job in ("flow-and-versions", "changes"):
              if results.get(job) != "success":
                  errors.append(f"{job} must succeed (got {results.get(job)})")
          if os.environ["SELENIUM_EXPECTED"] == "true" and results.get("selenium") != "success":
              errors.append(f"selenium is mandatory for this PR (got {results.get('selenium')})")

          lines = ["### Pull request gate", "", "| Job | Result |", "|---|---|"]
          lines += [f"| {job} | {result} |" for job, result in results.items()]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          for error in errors:
              print(f"::error::{error}")
          if errors:
              raise SystemExit(1)
          print("All required jobs passed.")
