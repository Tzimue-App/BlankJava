name: "Build & Publish Docker Images"

# Triggered on beta tags (vX.Y.Z-beta.N, created when dev is promoted to test)
# and on stable tags (vX.Y.Z, created when test is promoted to main). Alpha tags are not published.
# Images: ghcr.io/<owner>/<repo>-backend and ghcr.io/<owner>/<repo>-frontend, tagged with
#   - the component version   (backend/gradle.properties, frontend/package.json)  e.g. 1.2.0
#   - the project version     (root package.json, the git tag without "v")      e.g. 0.2.0-beta.1
#   - the channel             beta | latest
# See docs/technical_analysis.md §8.5.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: backend
            version-file: backend/gradle.properties
          - module: frontend
            version-file: frontend/package.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check that the module has a Dockerfile
        id: check
        run: |
          if [ -f "${{ matrix.module }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ${{ matrix.module }}/Dockerfile yet, skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read versions
        if: steps.check.outputs.present == 'true'
        env:
          VERSION_FILE: ${{ matrix.version-file }}
        run: |
          # GHCR image names must be lowercase; the repository name may not be.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.module }}" >> "$GITHUB_ENV"
          echo "PROJECT_VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"
          if [[ "$VERSION_FILE" == *package.json ]]; then
            COMPONENT_VERSION=$(jq -r .version "$VERSION_FILE")
          else
            COMPONENT_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' "$VERSION_FILE" | head -1)
          fi
          [ -n "$COMPONENT_VERSION" ] || { echo "::error::No version in $VERSION_FILE"; exit 1; }
          echo "COMPONENT_VERSION=$COMPONENT_VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then echo "CHANNEL=beta"; else echo "CHANNEL=latest"; fi >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: steps.check.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.check.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: steps.check.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.COMPONENT_VERSION }}
            type=raw,value=${{ env.PROJECT_VERSION }}
            type=raw,value=${{ env.CHANNEL }}
          labels: |
            org.opencontainers.image.version=${{ env.COMPONENT_VERSION }}
            org.opencontainers.image.description=${{ matrix.module }} ${{ env.COMPONENT_VERSION }} (release ${{ env.PROJECT_VERSION }})

      - name: Build and push image
        if: steps.check.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.module }}
          file: ./${{ matrix.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_RELEASE=${{ env.PROJECT_VERSION }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
