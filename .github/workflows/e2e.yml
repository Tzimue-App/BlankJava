name: "Selenium suite"

# Runs the Selenium suite against the full running stack and publishes a report for the
# human reviewer (docs/technical_analysis.md §3.6):
#   - Allure report (single HTML file): steps, screenshots, browser logs per test
#   - JUnit results, screenshots, Docker Compose logs of the run
#   - job summary and, on pull requests, a sticky comment with the totals and the report link
# Called by pull-request.yml; can also be started by hand on any branch.

on:
  workflow_call:
    secrets:
      JWT_PRIVATE_KEY:
        description: RSA 3072 private key (PKCS#8 PEM) signing the access tokens of the stack
        required: false
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The suite registers and logs in many users from one browser container (one client IP): Nginx's
    # /api/auth/* rate limit gets values the journeys never reach (infra/README.md, "Rate limiting").
    # Job-wide, so every docker compose call sees the same configuration (a differing one would make
    # "compose run" recreate the frontend); they take precedence over the .env copied from .env.example.
    env:
      NGINX_AUTH_RATE: 600r/m
      NGINX_AUTH_BURST: "100"
      NGINX_AUTH_RETRY_AFTER: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check that the stack and the suite exist
        id: check
        run: |
          if [ -f compose.yaml ] && [ -f e2e/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::compose.yaml or e2e/ not present yet, Selenium suite skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Created here, before Compose first mounts it, so it is owned by the runner user.
      # Otherwise Docker creates it as root on first bind-mount (the e2e service runs as
      # root in its container), and the later steps below cannot write into it.
      - name: Create the build output directory
        if: steps.check.outputs.present == 'true'
        run: mkdir -p e2e/build

      # compose.yaml mounts infra/secrets/ into the backend. The key comes from the JWT_PRIVATE_KEY
      # secret; a PR from a fork or from Dependabot gets no repository secret, so a throw-away key
      # is generated for that run instead. Readable by all (0644): the backend runs as another user
      # than the runner, and the runner is discarded after the job.
      - name: Provide the JWT signing key
        if: steps.check.outputs.present == 'true'
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
        run: |
          mkdir -p infra/secrets
          if [ -n "$JWT_PRIVATE_KEY" ]; then
            printf '%s\n' "$JWT_PRIVATE_KEY" > infra/secrets/jwt-private.pem
            echo "JWT signing key taken from the JWT_PRIVATE_KEY secret."
          else
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
              -out infra/secrets/jwt-private.pem 2> /dev/null
            echo "::notice::JWT_PRIVATE_KEY secret not available (fork or Dependabot PR): throw-away key pair generated for this run."
          fi
          chmod 644 infra/secrets/jwt-private.pem
          openssl pkey -in infra/secrets/jwt-private.pem -noout 2> /dev/null \
            || { echo "::error::infra/secrets/jwt-private.pem is not a valid private key."; exit 1; }

      - name: Start PostgreSQL, backend, frontend and Selenium
        if: steps.check.outputs.present == 'true'
        run: |
          [ -f .env.example ] && cp .env.example .env
          docker compose --profile e2e up --build --detach --wait

      # The runner container reaches the frontend as https://frontend through http://selenium:4444.
      # --profile e2e (not e2e-runner, the e2e service's own profile): a named "run" target ignores
      # its own profile, but Compose still needs selenium's profile active to resolve it as a
      # dependency (e2e/README.md).
      - name: Run the Selenium suite
        id: tests
        if: steps.check.outputs.present == 'true'
        continue-on-error: true
        # --build: "docker compose run" only builds when no image exists yet, so a locally cached
        # blankjava-e2e:local would otherwise run stale code (reproduced while developing #7).
        run: docker compose --profile e2e run --build --rm e2e

      - name: Collect Docker Compose logs
        if: always() && steps.check.outputs.present == 'true'
        run: docker compose --profile e2e logs --no-color --timestamps > e2e/build/compose-logs.txt

      - name: Generate the Allure report (single HTML file)
        if: always() && steps.check.outputs.present == 'true'
        run: |
          if [ -d e2e/build/allure-results ]; then
            npx --yes allure-commandline@2 generate --single-file --clean \
              e2e/build/allure-results -o e2e/build/allure-report
          fi

      - name: Summarise results
        id: summary
        if: always() && steps.check.outputs.present == 'true'
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          failed = []
          for path in glob.glob("e2e/build/test-results/**/*.xml", recursive=True):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
              for case in suite.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed.append(f"{case.get('classname', '').split('.')[-1]} › {case.get('name')}")
          broken = totals["failures"] + totals["errors"]
          passed = totals["tests"] - broken - totals["skipped"]
          status = "✅ passed" if totals["tests"] and not broken else ("❌ failed" if broken else "⚠️ no tests found")

          lines = [
              f"### Selenium suite {status}",
              "",
              "| Total | Passed | Failed | Skipped |",
              "|---|---|---|---|",
              f"| {totals['tests']} | {passed} | {broken} | {totals['skipped']} |",
          ]
          if failed:
              lines += ["", "**Failed tests**", ""] + [f"- {name}" for name in failed[:20]]
          text = "\n".join(lines) + "\n"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(text)
          with open("e2e-summary.md", "w", encoding="utf-8") as f:
              f.write(text)

      - name: Upload the Selenium report
        id: upload
        if: always() && steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report-${{ github.run_number }}
          retention-days: 30
          path: |
            e2e/build/allure-report/
            e2e/build/screenshots/
            e2e/build/test-results/
            e2e/build/compose-logs.txt
          if-no-files-found: warn

      - name: Add the report link to the summary
        if: always() && steps.check.outputs.present == 'true'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo ""
            echo "**Report for review:** [download the Selenium report]($ARTIFACT_URL) — open \`allure-report/index.html\` (screenshots and Compose logs included) · [workflow run]($RUN_URL)"
          } >> e2e-summary.md

      - name: Comment on the pull request
        if: always() && steps.check.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: selenium-report
          path: e2e-summary.md

      - name: Stop the stack
        if: always() && steps.check.outputs.present == 'true'
        run: docker compose --profile e2e down --volumes

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Selenium suite failed. See the report artifact."
          exit 1
