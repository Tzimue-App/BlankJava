name: Bug report
description: Existing behaviour is wrong.
title: "fix(<area>): <observable problem>"
labels: ["type: bug", "status: Todo"]
body:
  - type: markdown
    attributes:
      value: |
        Follow [the issue guidelines](../blob/main/.github/ISSUE_GUIDELINES.md). One problem per issue.
        **Do not post tokens, passwords, real e-mail addresses or other personal data.** Use test accounts.
        Exploitable security weaknesses go to *Security → Report a vulnerability*, not here.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 1–3 sentences. What is wrong, and who notices it?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Impact, not urgency (priority is set at triage).
      options:
        - High — user-visible bug, data integrity issue or exploitable weakness
        - Medium — degrades security, reliability or maintainability
        - Low — hygiene, cosmetic, documentation
    validations:
      required: true

  - type: checkboxes
    id: areas
    attributes:
      label: Area
      options:
        - label: api (OpenAPI contract)
        - label: backend (Spring Boot API)
        - label: frontend (Angular)
        - label: e2e (Selenium)
        - label: database (PostgreSQL, Flyway migrations)
        - label: logging / observability
        - label: infra / Docker
        - label: CI / release

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, how it runs (Docker Compose stack, local dev), browser if relevant.
      value: |
        | | |
        |---|---|
        | Release (footer) | |
        | Component versions (footer, `/actuator/info`) | |
        | Error reference / trace id | |
        | Commit | |
        | Runtime | |
        | Browser | |
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal and deterministic. Prefer `curl -i` commands for API bugs, and the page/route for UI bugs.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the response, the error message and the relevant log lines (search by trace id; `docker compose logs backend`).
      render: text
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected, how often, and what workaround exists.
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: Root cause
      description: Why it happens, with `path/File.java:line` links. Leave empty if unknown; it must be filled before the issue is Ready.

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Classes to change, contracts (status codes, payloads), migrations, compatibility. Enough for a reviewer to disagree before code is written.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, pass/fail. Include failure paths and non-regression.
      value: |
        - [ ] **Given** …, **when** …, **then** …
        - [ ] **Non-regression:** …
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: Which tests prove the fix (JUnit unit, `@WebMvcTest`/`@DataJpaTest` slice, Testcontainers integration, Angular/Vitest, Selenium e2e, manual). One must fail without the fix.

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue does not cover, and where it is tracked.

  - type: textarea
    id: related
    attributes:
      label: Related
      description: Linked issues, PRs, docs.

  - type: markdown
    attributes:
      value: |
        ### Definition of Done
        - [ ] All acceptance criteria are checked
        - [ ] A regression test fails without the fix and passes with it
        - [ ] Pull request suite green, coverage thresholds and diff coverage met
        - [ ] OpenAPI contract and frontend updated if the API changed
        - [ ] Selenium regression scenario added if the bug was user-visible
        - [ ] `CHANGELOG.md` `[Unreleased]` updated, `Bump-<component>:` set for every changed component (CI `flow-and-versions` green)
        - [ ] PR from the issue branch into the milestone branch `vX.Y.Z-a` reviewed and merged by a human, description contains `Closes #<issue>` (the issue closes when the milestone reaches `dev`)
