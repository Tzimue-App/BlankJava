# Minimal static server for the Angular build.
# TLS, the /api and /actuator reverse proxy, JSON access logs and security headers come with the
# Docker Compose stack (#5), which replaces this file.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Client-side routes: unknown paths serve the app, which shows its not-found page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always re-read: they change with every deployment
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Hashed bundles never change
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
