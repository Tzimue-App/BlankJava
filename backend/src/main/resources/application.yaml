# Default configuration (container). Secrets come from the environment (.env, Docker secrets).
spring:
  application:
    name: blankjava-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blankjava}
    username: ${DB_USER:blankjava}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway (docs/technical_analysis.md §4.4)
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  # Behind Nginx: the client IP and scheme come from X-Forwarded-* (docs/technical_analysis.md §3.5)
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Trust X-Forwarded-* only from Nginx's fixed address in compose.yaml (not the whole
      # subnet: the client as seen by Nginx, e.g. the Docker gateway, would then be dropped as
      # one more proxy). Nginx overwrites X-Forwarded-For with the real client address.
      internal-proxies: '172\.30\.0\.10'
    accesslog:
      # Switched on by compose.yaml (SERVER_TOMCAT_ACCESSLOG_ENABLED); written to stdout
      enabled: false
      directory: /dev
      prefix: stdout
      suffix: ""
      file-date-format: ""
      buffered: false
      # The access log is written after RemoteIpValve has restored the proxy's address: read
      # the client IP it recorded in the request attributes instead
      request-attributes-enabled: true
      # %a = client IP after X-Forwarded-For processing; %D = duration in microseconds (Tomcat 10+)
      pattern: '%a "%r" %s %b %Dus request_id=%{X-Request-Id}i'

blankjava:
  # Project release of the image (Docker build argument), shown by /actuator/info
  release: ${APP_RELEASE:unknown}

management:
  endpoints:
    web:
      exposure:
        include: health, info

# Swagger UI only in the dev profile
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
