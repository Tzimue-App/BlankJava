# Default configuration (container). Secrets come from the environment (.env, Docker secrets).
spring:
  application:
    name: blankjava-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blankjava}
    username: ${DB_USER:blankjava}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # The schema belongs to Flyway (docs/technical_analysis.md §4.4)
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  # Behind Nginx: the client IP and scheme come from X-Forwarded-* (docs/technical_analysis.md §3.5)
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Trust X-Forwarded-* only from Nginx's fixed address in compose.yaml (not the whole
      # subnet: the client as seen by Nginx, e.g. the Docker gateway, would then be dropped as
      # one more proxy). Nginx overwrites X-Forwarded-For with the real client address.
      internal-proxies: '172\.30\.0\.10'

logging:
  structured:
    # One JSON object per line, Elastic Common Schema field names (docs/technical_analysis.md §6.2)
    format:
      console: ecs
    json:
      # Trace ids from Micrometer Tracing under their ECS names
      rename:
        traceId: trace.id
        spanId: span.id

blankjava:
  # One JSON line per request (AccessLogFilter): switched on by compose.yaml
  access-log:
    enabled: false
  # Project release of the image (Docker build argument), shown by /actuator/info
  release: ${APP_RELEASE:unknown}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  tracing:
    sampling:
      # Every request gets a trace id in its logs; nothing is exported (no collector yet)
      probability: 1.0

# Swagger UI only in the dev profile
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
