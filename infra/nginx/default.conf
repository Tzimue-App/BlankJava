# Entry point of the stack (docs/technical_analysis.md §3.5): TLS termination, Angular app,
# reverse proxy to the backend. Mounted by compose.yaml as a template: at startup the image's
# entrypoint replaces the ${NGINX_AUTH_*} variables (and only those) from the environment and writes
# the result over the image's /etc/nginx/conf.d/default.conf.

# ---- Trace correlation (docs/technical_analysis.md §6.4) -----------------------------------------
# Trace id of the request: the browser's W3C traceparent when it is valid, otherwise Nginx's own
# $request_id (32 hexadecimal characters, the size of a trace id).
map $http_traceparent $trace_id {
    "~^00-(?<tid>[0-9a-f]{32})-[0-9a-f]{16}-[0-9a-f]{2}$" $tid;
    default $request_id;
}
map $request_id $request_span_id {
    "~^(?<sid>[0-9a-f]{16})" $sid;
}
# traceparent forwarded to the backend: the browser's, or one built from $request_id, so the backend
# logs the same trace id as this access log in both cases
map $http_traceparent $traceparent_out {
    "~^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$" $http_traceparent;
    default "00-$request_id-$request_span_id-01";
}

# ---- Access log: one JSON object per request, ECS field names --------------------------------
# Path without query string ($uri). Container health checks (from 127.0.0.1) are not logged.
map $remote_addr $loggable {
    127.0.0.1 0;
    default 1;
}
log_format ecs_json escape=json
    '{"@timestamp":"$time_iso8601","log.level":"INFO","event.dataset":"nginx.access",'
    '"trace.id":"$trace_id","request.id":"$request_id","client.ip":"$remote_addr",'
    '"http.request.method":"$request_method","url.path":"$uri",'
    '"http.response.status_code":$status,"http.response.body.bytes":$body_bytes_sent,'
    '"nginx.request_time_s":$request_time,"nginx.upstream_time_s":"$upstream_response_time",'
    '"user_agent.original":"$http_user_agent"}';

# ---- Rate limiting, first layer (docs/technical_analysis.md §5.3) -------------------------------
# Per client IP on /api/auth/* only, before a flood costs a password hash in the backend. The backend
# adds its own limits per IP and per e-mail (#64). Values per environment: compose.yaml, infra/README.md.
limit_req_zone $binary_remote_addr zone=auth:10m rate=${NGINX_AUTH_RATE};

# Plain HTTP only redirects to HTTPS
server {
    listen 80;
    server_name _;
    access_log /dev/stdout ecs_json if=$loggable;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;

    access_log /dev/stdout ecs_json if=$loggable;

    root /usr/share/nginx/html;
    # Requests are small JSON documents; uploads are out of scope
    client_max_body_size 64k;

    # Note: add_header in a location replaces the server-level ones, so every location that
    # sets its own header includes the snippet again.
    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS (127.0.0.11): "backend" is re-resolved every 10s instead of once at
    # worker start. Without this, recreating the backend container (a new IP on the stack network)
    # leaves Nginx proxying to the old, now-dead address until it is itself restarted — reproduced
    # while developing #7 ("connect() failed (111: Connection refused)" after rebuilding backend).
    # A variable in proxy_pass is what forces the per-request lookup; a bare hostname is cached.
    resolver 127.0.0.11 valid=10s;

    # ---- API and the public actuator endpoint -------------------------------------------------
    # Login, registration, refresh, logout: limited per client IP. Requests over the burst are
    # answered here with 429 and never reach the backend.
    location /api/auth/ {
        limit_req zone=auth burst=${NGINX_AUTH_BURST} nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 @too_many_requests;

        set $backend_upstream http://backend:8080;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $backend_upstream;
    }

    # Same body shape as the contract's TooManyRequests response (api/openapi.yaml): Problem Details
    # with the request's trace id, and Retry-After in seconds. No "instance": $uri is client input
    # and would have to be escaped; $trace_id only ever holds hexadecimal characters.
    location @too_many_requests {
        default_type application/problem+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After ${NGINX_AUTH_RETRY_AFTER} always;
        add_header Cache-Control "no-store" always;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many attempts. Try again later.","traceId":"$trace_id"}\n';
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $backend_upstream;
    }

    location = /actuator/info {
        set $backend_upstream http://backend:8080;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $backend_upstream;
    }

    # Other actuator endpoints stay internal
    location /actuator/ {
        return 404;
    }

    # ---- Angular application ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always re-read: they change with every deployment
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
    location = /config.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Hashed bundles never change
    location ~* \.(?:js|css|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
