# Headers sent to the backend (docs/technical_analysis.md §3.5).
proxy_http_version 1.1;
proxy_set_header Host              $host;
# Overwritten, never appended: a client cannot inject a fake IP through its own X-Forwarded-For
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  443;
# Correlates Nginx and backend log lines (structured logging, #6)
proxy_set_header X-Request-Id      $request_id;
proxy_set_header Connection        "";
